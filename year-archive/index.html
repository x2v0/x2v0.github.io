<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блог — Валерий Онучин</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .blog-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .post-list { list-style: none; padding: 0; }
        .post-item { margin-bottom: 15px; padding: 15px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; background: var(--card-bg); transition: transform 0.2s; }
        .post-item:hover { transform: translateX(5px); border-color: var(--accent); }
        .post-item h3 { margin: 0 0 5px 0; color: var(--accent); font-size: 18px; }
        .post-item .date { font-size: 12px; color: var(--fg3); }
        .article-view { display: none; line-height: 1.7; }
        .article-view h1 { color: var(--accent); }
        .article-view pre { background: var(--bg3); padding: 10px; border-radius: 5px; overflow-x: auto; }
        .article-view code { font-family: monospace; background: var(--bg3); padding: 2px 4px; border-radius: 3px; }
    </style>
</head>
<body style="font-family: inherit;">
    <div class="blog-container">
        <!-- Список статей -->
        <div id="list-view">
            <h1>Блог</h1>
            <p style="color: var(--fg2); margin-bottom: 20px;">Архив переписки и технических заметок.</p>
            <ul class="post-list" id="posts-ul">
                <li>Загрузка статей...</li>
            </ul>
        </div>

        <!-- Просмотр статьи -->
        <div id="article-view" class="article-view">
            <button onclick="backToList()" style="margin-bottom:20px; padding:8px 15px; background:var(--accent); color:#fff; border:none; border-radius:5px; cursor:pointer;">← К списку статей</button>
            <div id="article-content"></div>
            <div id="giscus-container" style="margin-top: 50px; padding-top: 20px; border-top: 1px solid var(--border);">
                <h3>Обсуждение</h3>
                <div class="giscus"></div>
            </div>
        </div>
    </div>

    <script>
        // 1. Загружаем манифест (список статей)
        fetch('./posts.json')
            .then(r => r.json())
            .then(posts => {
                const ul = document.getElementById('posts-ul');
                ul.innerHTML = '';
                if (posts.length === 0) {
                    ul.innerHTML = '<li>Пока нет статей.</li>';
                    return;
                }
                posts.forEach(post => {
                    const li = document.createElement('li');
                    li.className = 'post-item';
                    li.innerHTML = `<h3>${post.title}</h3><div class="date">${post.date}</div>`;
                    li.onclick = () => loadPost(post.filename, post.title);
                    ul.appendChild(li);
                });
            })
            .catch(e => {
                document.getElementById('posts-ul').innerHTML = '<li style="color:red;">Ошибка загрузки списка статей. Проверьте файл posts.json.</li>';
            });

        // 2. Функции переключения и загрузки
        function backToList() {
            document.getElementById('article-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            document.querySelector('.giscus').innerHTML = ''; // Очищаем старые комментарии
        }

        function loadPost(filename, title) {
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('article-view').style.display = 'block';
            document.getElementById('article-content').innerHTML = '<p>Загрузка...</p>';
            window.scrollTo(0,0);

            fetch('./posts/' + filename)
                .then(r => r.text())
                .then(md => {
                    document.getElementById('article-content').innerHTML = marked.parse(md);
                    loadUtterances(filename);
                })
                .catch(e => {
                    document.getElementById('article-content').innerHTML = '<p style="color:red;">Ошибка загрузки статьи.</p>';
                });
        }

        function loadUtterances(term) {
            const container = document.querySelector('.giscus');
            container.innerHTML = '';
            const script = document.createElement('script');
            script.src = 'https://utteranc.es/client.js';
            script.setAttribute('repo', 'x2v0/x2v0.github.io');
            script.setAttribute('issue-term', term);
            script.setAttribute('theme', 'preferred-color-scheme');
            script.setAttribute('crossorigin', 'anonymous');
            script.async = true;
            container.appendChild(script);
        }
    </script>
</body>
</html>
