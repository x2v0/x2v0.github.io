<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блог — Валерий Онучин</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* --- СТИЛИ ДЛЯ ЛЕНТЫ В СТИЛЕ СОЦСЕТЕЙ --- */
        body {
            background-color: var(--bg);
            color: var(--text);
        }
        .feed-container {
            max-width: 680px; /* Ширина как у постов в соцсетях */
            margin: 40px auto;
            padding: 0 15px;
        }
        .feed-header {
            font-family: monospace;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
        }
        
        /* Карточка поста */
        .post-card {
            background-color: var(--card-bg, #ffffff);
            border: 1px solid var(--border, #ddd);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .post-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            border-color: var(--accent);
        }
        [data-theme="dark"] .post-card {
            background-color: #1e1e1e;
            border-color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        [data-theme="dark"] .post-card:hover {
            border-color: var(--accent);
        }

        /* Шапка поста (Аватар + Имя + Дата) */
        .post-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .post-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 12px;
            border: 1px solid var(--border);
        }
        .post-meta {
            display: flex;
            flex-direction: column;
        }
        .post-author {
            font-weight: bold;
            font-size: 15px;
            color: var(--text);
        }
        .post-date {
            font-size: 12px;
            color: var(--fg3, #888);
            font-family: monospace;
        }

        /* Содержимое поста */
        .post-title {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: var(--accent);
            line-height: 1.3;
        }
        .post-preview {
            margin: 0;
            font-size: 15px;
            color: var(--text);
            line-height: 1.5;
            /* Обрезаем текст до 3 строк */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* Кнопка "Читать далее" */
        .post-footer {
            margin-top: 15px;
            font-size: 13px;
            color: var(--accent);
            font-weight: bold;
        }

        /* --- ПРОСМОТР ПОЛНОЙ СТАТЬИ --- */
        .article-view {
            display: none;
            background: var(--card-bg, #fff);
            border: 1px solid var(--border, #ddd);
            border-radius: 12px;
            padding: 30px;
        }
        [data-theme="dark"] .article-view {
            background-color: #1e1e1e;
            border-color: #333;
        }
        .article-view h1 { color: var(--accent); margin-top: 0; }
        .article-view pre { background: var(--bg3, #f4f4f4); padding: 10px; border-radius: 5px; overflow-x: auto; }
        .article-view code { font-family: monospace; background: var(--bg3, #eee); padding: 2px 4px; border-radius: 3px; }
        
        .btn-back {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 15px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif;">
    <div class="feed-container">
        <!-- Список постов -->
        <div id="list-view">
            <h1 class="feed-header">Лента</h1>
            <div id="posts-feed">
                <p style="color: var(--fg3);">Загрузка постов...</p>
            </div>
        </div>

        <!-- Просмотр статьи -->
        <div id="article-view" class="article-view">
            <button class="btn-back" onclick="backToFeed()">← Назад в ленту</button>
            <div id="article-content"></div>
            
            <div id="giscus-container" style="margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border);">
                <h3>Комментарии</h3>
                <div class="giscus"></div>
            </div>
        </div>
    </div>

    <script>
        // 1. Загружаем манифест
        fetch('./posts.json')
            .then(r => r.json())
            .then(posts => {
                const feed = document.getElementById('posts-feed');
                feed.innerHTML = '';
                
                if (posts.length === 0) {
                    feed.innerHTML = '<p>Пока нет постов.</p>';
                    return;
                }

                posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    
                    // Используем картинку из корня сайта
                    const avatarSrc = '../images/me.jpg'; 

                    card.innerHTML = `
                        <div class="post-header">
                            <img src="${avatarSrc}" class="post-avatar" alt="Avatar">
                            <div class="post-meta">
                                <span class="post-author">Валерий Онучин</span>
                                <span class="post-date">${post.date}</span>
                            </div>
                        </div>
                        <h3 class="post-title">${post.title}</h3>
                        <p class="post-preview">${post.preview || ''}</p>
                        <div class="post-footer">Читать далее →</div>
                    `;
                    
                    card.onclick = () => loadPost(post.filename, post.title);
                    feed.appendChild(card);
                });
            })
            .catch(e => {
                document.getElementById('posts-feed').innerHTML = '<p style="color:red;">Ошибка загрузки списка постов.</p>';
            });

        // 2. Переключение экранов
        function backToFeed() {
            document.getElementById('article-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            document.querySelector('.giscus').innerHTML = ''; 
        }

        function loadPost(filename, title) {
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('article-view').style.display = 'block';
            document.getElementById('article-content').innerHTML = '<p>Загрузка...</p>';
            window.scrollTo(0,0);

            fetch('./posts/' + filename)
                .then(r => r.text())
                .then(md => {
                    document.getElementById('article-content').innerHTML = marked.parse(md);
                    loadUtterances(filename);
                })
                .catch(e => {
                    document.getElementById('article-content').innerHTML = '<p style="color:red;">Ошибка загрузки статьи.</p>';
                });
        }

        // 3. Комментарии (Utterances)
        function loadUtterances(term) {
            const container = document.querySelector('.giscus');
            container.innerHTML = '';
            const script = document.createElement('script');
            script.src = 'https://utteranc.es/client.js';
            script.setAttribute('repo', 'x2v0/x2v0.github.io');
            script.setAttribute('issue-term', term);
            script.setAttribute('theme', 'preferred-color-scheme');
            script.setAttribute('crossorigin', 'anonymous');
            script.async = true;
            container.appendChild(script);
        }
    </script>
</body>
</html>
