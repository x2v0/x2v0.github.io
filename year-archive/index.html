<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блог — Валерий Онучин</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .blog-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .post-list { list-style: none; padding: 0; }
        .post-list li { margin-bottom: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; transition: background 0.2s; }
        .post-list li:hover { background: #f0f0f0; }
        .article-view { display: none; line-height: 1.7; }
        .article-view h1 { color: #0288d1; }
        .article-view pre { background: #f4f4f4; padding: 10px; border-radius: 5px; overflow-x: auto; }
        .article-view code { font-family: monospace; background: #eee; padding: 2px 4px; border-radius: 3px; }
        [data-theme="dark"] .post-list li { border-color: #333; }
        [data-theme="dark"] .post-list li:hover { background: #1a1a1a; }
        [data-theme="dark"] .article-view pre { background: #1a1a1a; }
        [data-theme="dark"] .article-view code { background: #333; }
    </style>
</head>
<body style="font-family: monospace;">
    <!-- Никаких кнопок "На главную" здесь больше нет! -->
    
    <div class="blog-container">
        <!-- Список статей -->
        <div id="list-view">
            <h1>Блог</h1>
            <p>Мои заметки о коде и инженерии.</p>
            <ul class="post-list" id="posts-ul">
                <li onclick="loadPost('hello-world.md')">Добро пожаловать в мой блог!</li>
            </ul>
        </div>

        <!-- Просмотр статьи -->
        <div id="article-view" class="article-view">
            <!-- Эта кнопка возвращает из статьи к списку статей (внутри блога) -->
            <button onclick="backToList()" style="margin-bottom:20px; padding:8px 15px; background:#0288d1; color:#fff; border:none; border-radius:5px; cursor:pointer;">← К списку статей</button>
            
            <div id="article-content"></div>
            
            <!-- Блок комментариев Utterances -->
            <div id="giscus-container" style="margin-top: 50px; padding-top: 20px; border-top: 1px solid #ddd;">
                <h3>Обсуждение статьи</h3>
                <div class="giscus"></div>
            </div>
        </div>
    </div>

    <script>
        function backToList() {
            document.getElementById('article-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
        }

        function loadPost(filename) {
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('article-view').style.display = 'block';
            document.getElementById('article-content').innerHTML = '<p>Загрузка...</p>';

            fetch('./posts/' + filename)
                .then(r => r.text())
                .then(md => {
                    document.getElementById('article-content').innerHTML = marked.parse(md);
                    loadUtterances(filename);
                })
                .catch(e => {
                    document.getElementById('article-content').innerHTML = '<p style="color:red;">Ошибка загрузки статьи.</p>';
                });
        }

        function loadUtterances(filename) {
            const container = document.querySelector('.giscus');
            container.innerHTML = ''; // Очищаем старые комментарии
            
            const script = document.createElement('script');
            script.src = 'https://utteranc.es/client.js';
            script.setAttribute('repo', 'x2v0/x2v0.github.io');
            script.setAttribute('issue-term', filename);
            script.setAttribute('theme', 'github-dark');
            script.setAttribute('crossorigin', 'anonymous');
            script.async = true;
            container.appendChild(script);
        }
    </script>
</body>
</html>
