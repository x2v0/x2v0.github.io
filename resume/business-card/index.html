<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valeriy Onuchin — Digital Card</title>
<style>
    :root { --bg: #f0f2f5; --card: #fff; --text: #1a1a1a; --muted: #666; --accent: #0066cc; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: var(--card); max-width: 400px; width: 100%; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; text-align: center; }
    .header-bg { height: 120px; background: linear-gradient(135deg, #0066cc, #00ccff); }
    .avatar { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--card); background: #ddd; margin: -60px auto 15px auto; }
    h1 { margin: 0; font-size: 1.8rem; font-weight: 700; }
    .role { color: var(--accent); font-weight: 600; margin: 5px 0 15px 0; }
    .bio { color: var(--muted); font-size: 0.95rem; padding: 0 20px; margin-bottom: 25px; }
    .links { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; padding: 0 20px; }
    .link-btn { flex: 1; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: opacity 0.2s; text-align: center; cursor: pointer; }
    .link-btn.primary { background: var(--text); color: var(--card); border: none; }
    .link-btn.secondary { background: transparent; border: 2px solid var(--text); color: var(--text); }
    .link-btn:hover { opacity: 0.8; }
</style>
<script>
function downloadVCard() {
    var vcard = "BEGIN:VCARD\nVERSION:3.0\n" +
        "FN:Valeriy Onuchin\n" +
        "N:Onuchin;Valeriy;;;\n" +
        "TITLE:Senior Software Engineer\n" +
        "EMAIL;TYPE=INTERNET:valeriy.onuchin@yandex.ru\n" +
        "URL:https://github.com/x2v0\n" +
        "URL:https://x2v0.github.io\n" +
        "END:VCARD";
    var blob = new Blob([vcard], {type: "text/vcard"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "valeriy-onuchin.vcf";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
</script>
</head>
<body>
    <div class="card">
        <div class="header-bg"></div>
        <div class="avatar"></div>
        <h1>Valeriy Onuchin</h1>
        <div class="role">Senior Software Engineer</div>
        <div class="bio">Application and systems programming, scientific and medical software, DevOps.</div>
        <div class="links">
            <button class="link-btn primary" onclick="downloadVCard()">Save vCard</button>
            <a href="https://github.com/x2v0" class="link-btn secondary">GitHub</a>
        </div>
    </div>
</body>
</html>
