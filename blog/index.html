<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блог — Валерий Онучин</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../marked.min.js"></script>
    <style>
        body { background-color: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; }
        .container { max-width: 760px; margin: 40px auto; padding: 0 20px; }
        .header { font-family: monospace; font-size: 32px; margin-bottom: 25px; }
        
        .search-bar { width: 100%; padding: 15px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; margin-bottom: 30px; box-sizing: border-box; background: var(--card-bg); color: var(--text); }
        
        .topic-group { margin-bottom: 20px; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); overflow: hidden; }
        .topic-header { padding: 15px 20px; cursor: pointer; background: var(--bg3); font-weight: bold; display: flex; justify-content: space-between; }
        .topic-header:hover { color: var(--accent); }
        .topic-posts { display: none; padding: 15px; }
        .topic-posts.open { display: block; }
        
        .post-card { border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; cursor: pointer; background: var(--bg); }
        .post-card:hover { border-color: var(--accent); }
        .post-title { margin: 0 0 10px 0; font-size: 18px; color: var(--text); }
        .post-preview { margin: 0; font-size: 14px; color: var(--fg3); line-height: 1.5; }
        
        .load-more { width: 100%; padding: 10px; margin-top: 10px; background: var(--bg3); border: 1px dashed var(--border); border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .article-view { display: none; }
        .btn-back { padding: 10px 15px; margin-bottom: 20px; background: #0288d1; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .article-content { background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border); font-size: 16px; line-height: 1.7; }
        
        .error-box { background: #ffebee; color: #c62828; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 14px; margin-bottom: 20px; white-space: pre-wrap; border: 1px solid #ef9a9a; display: none; }
    </style>
</head>
<body>
    <div id="error-box" class="error-box"></div>
    
    <div class="container">
        <!-- СПИСОК -->
        <div id="list-view">
            <div class="header">Оглавление</div>
            <input type="text" id="search-input" class="search-bar" placeholder="🔍 Поиск по темам...">
            <div id="feed">
                <p style="text-align:center; padding:20px;">Загрузка...</p>
            </div>
        </div>

        <!-- СТАТЬЯ -->
        <div id="article-view" class="article-view">
            <button class="btn-back" onclick="backToFeed()">← Назад</button>
            <div id="article-content" class="article-content"></div>
        </div>
    </div>

    <script>
        // --- ПЕРЕХВАТ ОШИБОК ---
        window.onerror = function(msg, url, line) {
            var box = document.getElementById('error-box');
            box.style.display = 'block';
            box.innerHTML += "ОШИБКА: " + msg + "\nСтрока: " + line + "\n\n";
        };

        var allPosts = [];
        var currentList = [];
        var openTopics = new Set();

        // --- ЗАГРУЗКА ---
        fetch('./posts.json')
            .then(function(r) {
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.json();
            })
            .then(function(data) {
                allPosts = data;
                currentList = data;
                renderFeed(allPosts);
            })
            .catch(function(err) {
                document.getElementById('feed').innerHTML = '<p style="color:red; text-align:center;">Ошибка загрузки данных: ' + err.message + '</p>';
            });

        // --- ПОИСК ---
        document.getElementById('search-input').addEventListener('input', function(e) {
            var q = e.target.value.toLowerCase().trim();
            if (!q) { renderFeed(allPosts); return; }
            var filtered = allPosts.filter(function(p) {
                return (p.title && p.title.toLowerCase().indexOf(q) !== -1) || 
                       (p.preview && p.preview.toLowerCase().indexOf(q) !== -1);
            });
            renderFeed(filtered, q);
        });

        // --- РЕНДЕРИНГ ---
        function renderFeed(posts, query) {
            currentList = posts;
            var feed = document.getElementById('feed');
            feed.innerHTML = '';
            
            if (posts.length === 0) {
                feed.innerHTML = '<p style="text-align:center;">Ничего не найдено.</p>';
                return;
            }

            var groups = {};
            posts.forEach(function(p) {
                var tid = p.thread_id || 'general';
                if (!groups[tid]) {
                    var name = (p.title || '').split('(')[0].replace(/Re:|Aw:|Fwd:/gi, '').trim() || 'Общее';
                    groups[tid] = { id: tid, name: name, posts: [], date: p.date };
                }
                groups[tid].posts.push(p);
                if (p.date > groups[tid].date) groups[tid].date = p.date;
            });

            var sorted = Object.keys(groups).map(function(k) { return groups[k]; }).sort(function(a, b) {
                return b.date.localeCompare(a.date);
            });

            sorted.forEach(function(group) {
                var isOpen = query ? true : openTopics.has(group.id);
                
                var div = document.createElement('div');
                div.className = 'topic-group';

                var head = document.createElement('div');
                head.className = 'topic-header';
                head.innerHTML = '<span>' + (isOpen ? '📂' : '📁') + ' ' + group.name + '</span><span>' + group.posts.length + '</span>';
                head.onclick = function() {
                    if (query) return;
                    if (openTopics.has(group.id)) openTopics.delete(group.id);
                    else openTopics.add(group.id);
                    renderFeed(posts, query);
                };

                var container = document.createElement('div');
                container.className = 'topic-posts ' + (isOpen ? 'open' : '');

                var page = 1;
                var perPage = 10;
                
                var drawChunk = function() {
                    container.innerHTML = '';
                    var end = page * perPage;
                    var chunk = group.posts.slice(0, end);

                    chunk.forEach(function(post) {
                        var card = document.createElement('div');
                        card.className = 'post-card';
                        card.innerHTML = '<h3 class="post-title">' + highlight(post.title, query) + '</h3>' +
                                         '<p class="post-preview">' + highlight(post.preview || '', query) + '</p>';
                        card.onclick = function() { loadPost(post.filename); };
                        container.appendChild(card);
                    });

                    if (group.posts.length > end) {
                        var btn = document.createElement('button');
                        btn.className = 'load-more';
                        btn.innerText = 'Показать еще ' + (group.posts.length - end) + ' ↓';
                        btn.onclick = function() { page++; drawChunk(); };
                        container.appendChild(btn);
                    }
                };

                drawChunk();
                div.appendChild(head);
                div.appendChild(container);
                feed.appendChild(div);
            });
        }

        function highlight(text, q) {
            if (!q || !text) return text;
            var safeQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return text.replace(new RegExp('(' + safeQ + ')', 'gi'), '<mark style="background:#ffeb3b;color:#000;">$1</mark>');
        }

        // --- СТАТЬЯ ---
        function backToFeed() {
            document.getElementById('article-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            window.scrollTo(0,0);
        }

        function loadPost(filename) {
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('article-view').style.display = 'block';
            document.getElementById('article-content').innerHTML = 'Загрузка...';
            window.scrollTo(0,0);

            fetch('./posts/' + filename)
                .then(function(r) { return r.text(); })
                .then(function(md) {
                    if (typeof marked !== 'undefined') {
                        document.getElementById('article-content').innerHTML = marked.parse(md);
                    } else {
                        document.getElementById('article-content').innerHTML = '<pre>' + md + '</pre>';
                    }
                })
                .catch(function(e) {
                    document.getElementById('article-content').innerHTML = 'Ошибка загрузки статьи: ' + e.message;
                });
        }
    </script>
</body>
</html>
