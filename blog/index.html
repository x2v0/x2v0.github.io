<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блог — Валерий Онучин</title>
    <link rel="stylesheet" href="../style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        body { background-color: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .header { font-family: monospace; font-size: 32px; margin-bottom: 25px; }
        
        .search-bar { width: 100%; padding: 15px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; margin-bottom: 30px; box-sizing: border-box; background: var(--card-bg); color: var(--text); }
        
        /* Дерево (TOC) */
        .topic-group { margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); overflow: hidden; }
        .topic-header { padding: 18px 20px; cursor: pointer; background: var(--bg3); font-weight: bold; display: flex; justify-content: space-between; user-select: none; }
        .topic-header:hover { color: var(--accent); }
        .topic-posts { display: none; padding: 15px; }
        .topic-posts.open { display: block; }
        
        /* Карточки */
        .post-card { position: relative; border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 15px; cursor: pointer; background: var(--bg); overflow: hidden; transition: all 0.2s; }
        .post-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .post-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--sender-color, #0288d1); }
        
        .sender-header { margin-bottom: 10px; display: flex; align-items: center; }
        .sender-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--sender-color, #0288d1); color: white; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; margin-right: 10px; }
        .sender-name { font-size: 13px; color: var(--fg3); font-weight: bold; }
        
        .post-title { margin: 0 0 10px 0; font-size: 18px; color: var(--text); }
        .post-preview { margin: 0; font-size: 14px; color: var(--fg2); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Статья */
        .article-view { display: none; }
        .btn-back { padding: 12px 20px; margin-bottom: 20px; background: #0288d1; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .article-content { background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border); font-size: 16px; line-height: 1.7; }
        
        /* Детали (цитаты) внутри статьи */
        details { background: var(--bg3); padding: 15px; border-radius: 8px; margin-top: 25px; border: 1px solid var(--border); }
        summary { cursor: pointer; font-weight: bold; color: var(--accent); }
        details pre { background: transparent; border: none; padding: 0; margin-top: 15px; font-size: 14px; color: var(--fg3); white-space: pre-wrap; }

        /* Типографика статьи */
        .article-content h1 { font-size: 28px; margin-top: 0; }
        .article-content pre { background: #282c34; padding: 15px; border-radius: 8px; overflow-x: auto; position: relative; }
        .article-content code { font-family: monospace; font-size: 14px; }
        .article-content p code { background: var(--bg3); padding: 2px 6px; border-radius: 4px; color: #e83e8c; }
        .copy-btn { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
        .copy-btn:hover { background: rgba(255,255,255,0.2); }

        /* Навигация */
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }
        .nav-btn { padding: 10px 15px; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-weight: bold; }
        .nav-btn:hover { background: var(--accent); color: white; }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        mark { background: #ffeb3b; color: #000; padding: 0 2px; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- СПИСОК -->
        <div id="list-view">
            <div class="header">Оглавление</div>
            <input type="text" id="search-input" class="search-bar" placeholder="🔍 Поиск по всем темам...">
            <div id="feed"><p style="text-align:center; padding:20px;">Загрузка...</p></div>
        </div>

        <!-- СТАТЬЯ -->
        <div id="article-view" class="article-view">
            <button class="btn-back" onclick="backToFeed()">← Назад к оглавлению</button>
            <div id="article-content" class="article-content"></div>
            <div class="nav-buttons">
                <button id="btn-prev" class="nav-btn">← Предыдущее</button>
                <button id="btn-next" class="nav-btn">Следующее →</button>
            </div>
        </div>
    </div>

    <script>
        var allPosts = [];
        var currentTopicPosts = [];
        var currentPostIndex = -1;
        var openTopics = new Set();

        fetch('./posts.json').then(r => r.json()).then(data => { allPosts = data; renderFeed(allPosts); })
            .catch(err => { document.getElementById('feed').innerHTML = '<p style="color:red; text-align:center;">Ошибка загрузки: ' + err.message + '</p>'; });

        document.getElementById('search-input').addEventListener('input', function(e) {
            var q = e.target.value.toLowerCase().trim();
            if (!q) { renderFeed(allPosts); return; }
            var filtered = allPosts.filter(p => (p.title && p.title.toLowerCase().includes(q)) || (p.preview && p.preview.toLowerCase().includes(q)));
            renderFeed(filtered, q);
        });

        function renderFeed(posts, query) {
            var feed = document.getElementById('feed');
            feed.innerHTML = '';
            if (posts.length === 0) { feed.innerHTML = '<p style="text-align:center;">Ничего не найдено.</p>'; return; }

            var groups = {};
            posts.forEach(p => {
                var tid = p.thread_id || 'general';
                if (!groups[tid]) {
                    var name = (p.title || '').split('(')[0].replace(/Re:|Aw:|Fwd:/gi, '').trim() || 'Общее';
                    groups[tid] = { id: tid, name: name, posts: [], date: p.date };
                }
                groups[tid].posts.push(p);
                if (p.date > groups[tid].date) groups[tid].date = p.date;
            });

            var sorted = Object.keys(groups).map(k => groups[k]).sort((a, b) => b.date.localeCompare(a.date));

            sorted.forEach(group => {
                var isOpen = query ? true : openTopics.has(group.id);
                var div = document.createElement('div');
                div.className = 'topic-group';

                var head = document.createElement('div');
                head.className = 'topic-header';
                head.innerHTML = '<span>' + (isOpen ? '📂' : '📁') + ' ' + group.name + '</span><span>' + group.posts.length + '</span>';
                head.onclick = () => { if (query) return; if (openTopics.has(group.id)) openTopics.delete(group.id); else openTopics.add(group.id); renderFeed(posts, query); };

                var container = document.createElement('div');
                container.className = 'topic-posts ' + (isOpen ? 'open' : '');

                group.posts.forEach(post => {
                    var card = document.createElement('div');
                    card.className = 'post-card';
                    card.style.setProperty('--sender-color', post.sender_color || '#0288d1');
                    var initial = post.sender_name ? post.sender_name.replace(/[\[\]]/g, '') : '?';
                    
                    card.innerHTML = '<div class="sender-header"><div class="sender-avatar">' + initial + '</div><span class="sender-name">' + (post.sender_name || 'Аноним') + '</span></div>' +
                                     '<h3 class="post-title">' + highlight(post.title, query) + '</h3>' +
                                     '<p class="post-preview">' + highlight(post.preview || '', query) + '</p>';
                    card.onclick = () => loadPost(post, group.posts);
                    container.appendChild(card);
                });

                div.appendChild(head);
                div.appendChild(container);
                feed.appendChild(div);
            });
        }

        function highlight(text, q) {
            if (!q || !text) return text;
            var safeQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return text.replace(new RegExp('(' + safeQ + ')', 'gi'), '<mark>$1</mark>');
        }

        function backToFeed() {
            document.getElementById('article-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            window.scrollTo(0,0);
        }

        function loadPost(post, topicPosts) {
            currentTopicPosts = topicPosts;
            currentPostIndex = topicPosts.findIndex(p => p.id === post.id);

            document.getElementById('list-view').style.display = 'none';
            document.getElementById('article-view').style.display = 'block';
            document.getElementById('article-content').innerHTML = 'Загрузка...';
            window.scrollTo(0,0);

            updateNavButtons();

            fetch('./posts/' + post.filename).then(r => r.text()).then(md => {
                document.getElementById('article-content').innerHTML = marked.parse(md);
                
                if (typeof hljs !== 'undefined') {
                    document.querySelectorAll('pre code').forEach(block => {
                        hljs.highlightElement(block);
                        var pre = block.parentNode;
                        var btn = document.createElement('button');
                        btn.className = 'copy-btn';
                        btn.innerText = 'Copy';
                        btn.onclick = (e) => { e.stopPropagation(); navigator.clipboard.writeText(block.innerText).then(() => { btn.innerText = 'Copied!'; setTimeout(() => btn.innerText = 'Copy', 2000); }); };
                        pre.appendChild(btn);
                    });
                }
            }).catch(e => { document.getElementById('article-content').innerHTML = 'Ошибка загрузки: ' + e.message; });
        }

        function updateNavButtons() {
            var btnPrev = document.getElementById('btn-prev');
            var btnNext = document.getElementById('btn-next');

            if (currentPostIndex > 0) {
                btnPrev.disabled = false;
                btnPrev.onclick = () => loadPost(currentTopicPosts[currentPostIndex - 1], currentTopicPosts);
            } else {
                btnPrev.disabled = true;
            }

            if (currentPostIndex !== -1 && currentPostIndex < currentTopicPosts.length - 1) {
                btnNext.disabled = false;
                btnNext.onclick = () => loadPost(currentTopicPosts[currentPostIndex + 1], currentTopicPosts);
            } else {
                btnNext.disabled = true;
            }
        }
    </script>
</body>
</html>
