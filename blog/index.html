<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блог — Валерий Онучин</title>
    <link rel="stylesheet" href="../style.css">
    
    <!-- Подключаем библиотеки -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flexsearch@0.7.31/dist/flexsearch.bundle.js"></script>
    
    <!-- Подсветка кода (Highlight.js) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        /* --- ОБЩИЕ СТИЛИ --- */
        body { background-color: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
        .feed-container { max-width: 760px; margin: 40px auto; padding: 0 20px; }
        
        /* --- ПОЛОСА ПРОГРЕССА ЧТЕНИЯ --- */
        #progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: transparent; z-index: 9999; display: none; }
        #progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s ease; box-shadow: 0 0 10px var(--accent); }

        /* --- ЗАГОЛОВОК И СТЕКЛЯННЫЙ ПОИСК --- */
        .feed-header { font-family: monospace; font-size: 32px; margin-bottom: 25px; letter-spacing: -1px; }
        .search-wrapper { position: sticky; top: 15px; z-index: 100; margin-bottom: 30px; }
        .search-bar { 
            width: 100%; padding: 16px 20px; border: 1px solid var(--border); border-radius: 12px; 
            font-size: 16px; background: rgba(255, 255, 255, 0.85); color: var(--text); 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: all 0.3s ease;
        }
        [data-theme="dark"] .search-bar { background: rgba(30, 30, 30, 0.85); }
        .search-bar:focus { outline: none; border-color: var(--accent); box-shadow: 0 4px 20px rgba(2, 136, 209, 0.2); }

        /* --- ЗАГОЛОВКИ ГРУПП --- */
        .group-header { 
            margin: 40px 0 20px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--accent); font-family: monospace; display: flex; align-items: center; gap: 10px;
        }
        .group-header::after { content: ""; flex: 1; height: 1px; background: var(--border); }

        /* --- КАРТОЧКА ПОСТА (АНИМАЦИЯ) --- */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .post-card { 
            position: relative; background: var(--card-bg, #fff); border: 1px solid var(--border, #ddd); 
            border-radius: 16px; padding: 25px; margin-bottom: 20px; cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            animation: fadeInUp 0.5s ease backwards;
        }
        .post-card:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 12px 25px rgba(0,0,0,0.1); border-color: var(--accent); }
        [data-theme="dark"] .post-card { background: #1e1e1e; border-color: #333; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        [data-theme="dark"] .post-card:hover { border-color: var(--accent); box-shadow: 0 12px 25px rgba(0,0,0,0.5); }

        /* --- ЗВЕЗДОЧКА --- */
        .bookmark-btn { position: absolute; top: 25px; right: 25px; cursor: pointer; font-size: 22px; opacity: 0.2; transition: all 0.2s; user-select: none; }
        .bookmark-btn:hover { transform: scale(1.2); opacity: 0.6; }
        .bookmark-btn.active { opacity: 1; color: #fbc02d; text-shadow: 0 0 10px rgba(251, 192, 45, 0.4); }

        /* --- ШАПКА КАРТОЧКИ --- */
        .post-header { display: flex; align-items: center; margin-bottom: 18px; }
        .post-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; margin-right: 15px; border: 2px solid var(--border); }
        .post-meta { display: flex; flex-direction: column; }
        .post-author { font-weight: 700; font-size: 16px; color: var(--text); letter-spacing: -0.3px; }
        .post-date { font-size: 13px; color: var(--fg3, #888); font-family: monospace; margin-top: 2px; }

        /* --- ТЕКСТ КАРТОЧКИ --- */
        .post-title { margin: 0 0 12px 0; font-size: 20px; color: var(--text); line-height: 1.4; padding-right: 35px; font-weight: 700; letter-spacing: -0.5px; }
        .post-preview { margin: 0; font-size: 15px; color: var(--fg2); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .post-footer { margin-top: 20px; font-size: 13px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        
        mark { background: #ffeb3b; color: #000; padding: 0 4px; border-radius: 4px; font-weight: bold; }

        /* --- ПРОСМОТР СТАТЬИ (ЧИСТЫЙ ДИЗАЙН) --- */
        .article-view { display: none; animation: fadeInUp 0.4s ease; }
        .article-content-wrapper {
            background: var(--card-bg, #fff); border: 1px solid var(--border, #ddd);
            border-radius: 16px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 30px;
        }
        [data-theme="dark"] .article-content-wrapper { background: #1e1e1e; border-color: #333; }
        
        /* Типографика статьи (как в Medium) */
        .article-view h1 { color: var(--text); font-size: 32px; line-height: 1.3; margin-top: 0; margin-bottom: 25px; letter-spacing: -1px; }
        .article-view h2 { color: var(--text); font-size: 24px; margin-top: 40px; margin-bottom: 15px; }
        .article-view h3 { color: var(--text); font-size: 20px; margin-top: 30px; margin-bottom: 10px; }
        .article-view p { font-size: 17px; line-height: 1.7; color: var(--fg2); margin-bottom: 20px; }
        .article-view img { max-width: 100%; border-radius: 8px; margin: 20px 0; }
        .article-view blockquote { border-left: 4px solid var(--accent); padding-left: 20px; margin: 25px 0; color: var(--fg3); font-style: italic; background: var(--bg3); padding: 15px 20px; border-radius: 0 8px 8px 0; }
        .article-view pre { background: #282c34; padding: 20px; border-radius: 10px; overflow-x: auto; margin: 25px 0; }
        .article-view code { font-family: 'Fira Code', 'Courier New', monospace; font-size: 14px; }
        .article-view p code, .article-view li code { background: var(--bg3); padding: 3px 6px; border-radius: 4px; font-size: 14px; color: #e83e8c; }

        /* Кнопки управления */
        .btn-back { 
            display: inline-flex; align-items: center; gap: 8px; margin-bottom: 25px; padding: 12px 20px; 
            background: #0288d1; color: #fff; border: none; border-radius: 8px; cursor: pointer; 
            font-size: 15px; font-weight: 600; transition: all 0.2s; box-shadow: 0 4px 10px rgba(2, 136, 209, 0.3);
        }
        .btn-back:hover { background: #0277bd; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(2, 136, 209, 0.4); }

        /* Навигация Prev/Next */
        .nav-container { display: flex; justify-content: space-between; gap: 15px; margin-top: 30px; }
        .btn-nav { 
            flex: 1; padding: 15px 20px; background: var(--card-bg, #fff); color: var(--text); 
            border: 1px solid var(--border); border-radius: 12px; cursor: pointer; 
            font-weight: 600; font-size: 15px; transition: all 0.2s; display: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .btn-nav:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(2, 136, 209, 0.2); }

        /* Кнопка Наверх (FAB) */
        #btn-up {
            position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; border-radius: 50%;
            background: var(--accent); color: white; border: none; font-size: 24px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(2, 136, 209, 0.4); display: none; z-index: 1000;
            transition: all 0.3s;
        }
        #btn-up:hover { transform: scale(1.1) translateY(-3px); }

        /* Комментарии */
        #giscus-container { background: var(--card-bg, #fff); border: 1px solid var(--border, #ddd); border-radius: 16px; padding: 30px; }
        [data-theme="dark"] #giscus-container { background: #1e1e1e; border-color: #333; }
    </style>
</head>
<body style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    
    <!-- Полоса прогресса -->
    <div id="progress-container"><div id="progress-bar"></div></div>

    <div class="feed-container">
        <!-- СПИСОК -->
        <div id="list-view">
            <h1 class="feed-header">Лента записей</h1>
            
            <div class="search-wrapper">
                <input type="text" id="search-input" class="search-bar" placeholder="🔍 Поиск по письмам...">
            </div>

            <div id="posts-feed">
                <p style="color: var(--fg3); text-align: center; padding: 40px 0;">Загрузка постов...</p>
            </div>
        </div>

        <!-- СТАТЬЯ -->
        <div id="article-view" class="article-view">
            <button class="btn-back" onclick="backToFeed()">← Назад в ленту</button>
            
            <div class="article-content-wrapper">
                <div id="article-content"></div>
            </div>
            
            <div class="nav-container">
                <button id="btn-prev" class="btn-nav">← Предыдущая</button>
                <button id="btn-next" class="btn-nav">Следующая →</button>
            </div>

            <div id="giscus-container" style="margin-top: 30px;">
                <h3 style="margin-top:0; font-family: monospace;">Комментарии</h3>
                <div class="giscus"></div>
            </div>
        </div>
    </div>

    <!-- Кнопка Наверх -->
    <button id="btn-up" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑</button>

    <script>
        let allPosts = [];
        let currentPostsList = []; 
        let currentPostIndex = -1;
        let searchIndex = null;

        // 1. Загрузка данных
        fetch('./posts.json')
            .then(r => r.json())
            .then(posts => {
                allPosts = posts;
                searchIndex = new FlexSearch.Document({ document: { id: "id", index: ["title", "preview"], store: true }, tokenize: "forward" });
                posts.forEach(p => searchIndex.add(p));
                renderFeed(posts);
            })
            .catch(e => { document.getElementById('posts-feed').innerHTML = '<p style="color:red; text-align:center;">Ошибка загрузки.</p>'; });

        // 2. Поиск
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.trim();
            if (!query) { renderFeed(allPosts); return; }
            if (!searchIndex) return;
            const results = searchIndex.search(query, { limit: 50 });
            const ids = new Set();
            results.forEach(res => res.result.forEach(id => ids.add(id)));
            renderFeed(allPosts.filter(p => ids.has(p.id)), query);
        });

        // 3. Рендеринг ленты
        function renderFeed(posts, query = '') {
            currentPostsList = posts; 
            const feed = document.getElementById('posts-feed');
            feed.innerHTML = '';
            if (posts.length === 0) { feed.innerHTML = '<p style="text-align:center; color:var(--fg3);">Ничего не найдено.</p>'; return; }

            const groups = {};
            posts.forEach(p => {
                const tid = p.thread_id || 'general';
                if (!groups[tid]) {
                    let groupName = (p.title || '').split('(')[0].replace(/Re:|Aw:|Fwd:/gi, '').trim() || 'Общее';
                    groups[tid] = { name: groupName, posts: [] };
                }
                groups[tid].posts.push(p);
            });

            let animationDelay = 0;
            Object.values(groups).forEach(group => {
                const groupDiv = document.createElement('div');
                groupDiv.innerHTML = `<h2 class="group-header">${highlight(group.name, query)} (${group.posts.length})</h2>`;
                
                group.posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.style.animationDelay = `${animationDelay}ms`;
                    animationDelay += 50; // Каскадная анимация

                    const isBookmarked = localStorage.getItem('bm_' + post.id) === '1';
                    card.innerHTML = `
                        <div class="bookmark-btn ${isBookmarked ? 'active' : ''}" onclick="toggleBookmark(event, '${post.id}')">★</div>
                        <div class="post-header">
                            <img src="../images/me.jpg" class="post-avatar" alt="Avatar">
                            <div class="post-meta">
                                <span class="post-author">Валерий Онучин</span>
                                <span class="post-date">${post.date}</span>
                            </div>
                        </div>
                        <h3 class="post-title">${highlight(post.title, query)}</h3>
                        <p class="post-preview">${highlight(post.preview || '', query)}</p>
                        <div class="post-footer">Читать далее →</div>
                    `;
                    card.onclick = (e) => { if (!e.target.classList.contains('bookmark-btn')) loadPost(post.filename); };
                    groupDiv.appendChild(card);
                });
                feed.appendChild(groupDiv);
            });
        }

        function highlight(text, query) {
            if (!query) return text;
            return text.replace(new RegExp(`(${query})`, 'gi'), '<mark>$1</mark>');
        }

        function toggleBookmark(e, id) {
            e.stopPropagation();
            const key = 'bm_' + id;
            if (localStorage.getItem(key) === '1') { localStorage.removeItem(key); e.target.classList.remove('active'); }
            else { localStorage.setItem(key, '1'); e.target.classList.add('active'); }
        }

        // 4. Чтение статьи
        function backToFeed() {
            document.getElementById('article-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            document.getElementById('progress-container').style.display = 'none';
            document.querySelector('.giscus').innerHTML = '';
            window.scrollTo(0,0);
        }

        function loadPost(filename) {
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('article-view').style.display = 'block';
            document.getElementById('progress-container').style.display = 'block';
            document.getElementById('article-content').innerHTML = '<p style="text-align:center; padding: 40px;">Загрузка...</p>';
            window.scrollTo(0,0);

            currentPostIndex = currentPostsList.findIndex(p => p.filename === filename);
            updateNavButtons();

            fetch('./posts/' + filename)
                .then(r => r.text())
                .then(md => {
                    document.getElementById('article-content').innerHTML = marked.parse(md);
                    // Подсветка кода
                    document.querySelectorAll('pre code').forEach((block) => {
                        hljs.highlightElement(block);
                    });
                    loadUtterances(filename);
                })
                .catch(e => { document.getElementById('article-content').innerHTML = '<p style="color:red;">Ошибка.</p>'; });
        }

        function updateNavButtons() {
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');

            if (currentPostIndex > 0) {
                btnPrev.style.display = 'block';
                btnPrev.onclick = () => loadPost(currentPostsList[currentPostIndex - 1].filename);
            } else { btnPrev.style.display = 'none'; }

            if (currentPostIndex !== -1 && currentPostIndex < currentPostsList.length - 1) {
                btnNext.style.display = 'block';
                btnNext.onclick = () => loadPost(currentPostsList[currentPostIndex + 1].filename);
            } else { btnNext.style.display = 'none'; }
        }

        // 5. Скролл и Прогресс
        window.onscroll = function() {
            // Кнопка Наверх
            const btnUp = document.getElementById('btn-up');
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                btnUp.style.display = "block";
            } else {
                btnUp.style.display = "none";
            }

            // Полоса прогресса
            if (document.getElementById('article-view').style.display === 'block') {
                const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scrolled = (winScroll / height) * 100;
                document.getElementById("progress-bar").style.width = scrolled + "%";
            }
        };

        function loadUtterances(term) {
            const container = document.querySelector('.giscus');
            container.innerHTML = '';
            const script = document.createElement('script');
            script.src = 'https://utteranc.es/client.js';
            script.setAttribute('repo', 'x2v0/x2v0.github.io');
            script.setAttribute('issue-term', term);
            script.setAttribute('theme', 'preferred-color-scheme');
            script.setAttribute('crossorigin', 'anonymous');
            script.async = true;
            container.appendChild(script);
        }
    </script>
</body>
</html>
