<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блог — Валерий Онучин</title>
    <link rel="stylesheet" href="../style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flexsearch@0.7.31/dist/flexsearch.bundle.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        body { background-color: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
        .feed-container { max-width: 760px; margin: 40px auto; padding: 0 20px; }
        
        /* --- ТЕМА --- */
        #theme-toggle { position: fixed; top: 20px; right: 20px; z-index: 9999; font-size: 24px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s; }
        #theme-toggle:hover { transform: scale(1.1); }

        /* --- ПРОГРЕСС --- */
        #progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: transparent; z-index: 9999; display: none; }
        #progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s ease; box-shadow: 0 0 10px var(--accent); }

        /* --- ПОИСК --- */
        .feed-header { font-family: monospace; font-size: 32px; margin-bottom: 25px; letter-spacing: -1px; }
        .search-wrapper { position: sticky; top: 15px; z-index: 100; margin-bottom: 30px; }
        .search-bar { width: 100%; padding: 16px 20px; border: 1px solid var(--border); border-radius: 12px; font-size: 16px; background: rgba(255, 255, 255, 0.85); color: var(--text); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: all 0.3s ease; }
        [data-theme="dark"] .search-bar { background: rgba(30, 30, 30, 0.85); }
        .search-bar:focus { outline: none; border-color: var(--accent); box-shadow: 0 4px 20px rgba(2, 136, 209, 0.2); }

        /* --- ДЕРЕВО (TOC) --- */
        .topic-group { margin-bottom: 15px; border-radius: 12px; background: var(--card-bg); border: 1px solid var(--border); overflow: hidden; transition: all 0.3s; }
        .topic-header { display: flex; align-items: center; padding: 18px 20px; cursor: pointer; user-select: none; background: var(--card-bg); transition: background 0.2s; }
        .topic-header:hover { background: var(--bg3); }
        .topic-icon { font-size: 20px; margin-right: 15px; transition: transform 0.3s; }
        .topic-name { font-weight: 700; font-size: 18px; color: var(--text); flex: 1; letter-spacing: -0.5px; }
        .topic-count { font-size: 13px; background: var(--bg3); padding: 4px 10px; border-radius: 20px; color: var(--fg3); font-family: monospace; border: 1px solid var(--border); }
        
        .topic-posts { display: none; padding: 15px; border-top: 1px solid var(--border); background: var(--bg); }
        .topic-posts.open { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- КАРТОЧКА --- */
        .post-card { position: relative; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 15px; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .post-card:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.08); border-color: var(--accent); }
        .post-card:last-child { margin-bottom: 0; }
        
        .bookmark-btn { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 20px; opacity: 0.2; transition: all 0.2s; }
        .bookmark-btn.active { opacity: 1; color: #fbc02d; }
        
        .post-title { margin: 0 0 10px 0; font-size: 18px; color: var(--text); line-height: 1.4; padding-right: 30px; }
        .post-preview { margin: 0; font-size: 14px; color: var(--fg2); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .post-meta { margin-top: 12px; font-size: 12px; color: var(--fg3); font-family: monospace; display: flex; justify-content: space-between; }
        
        mark { background: #ffeb3b; color: #000; padding: 0 2px; border-radius: 2px; }

        /* --- СТАТЬЯ --- */
        .article-view { display: none; animation: fadeIn 0.3s ease; }
        .article-content-wrapper { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 30px; position: relative; }
        .article-view h1 { color: var(--text); font-size: 32px; line-height: 1.3; margin-top: 0; margin-bottom: 25px; letter-spacing: -1px; }
        .article-view p { font-size: 17px; line-height: 1.7; color: var(--fg2); margin-bottom: 20px; }
        .article-view blockquote { border-left: 4px solid var(--accent); padding-left: 20px; margin: 25px 0; color: var(--fg3); font-style: italic; background: var(--bg3); padding: 15px 20px; border-radius: 0 8px 8px 0; }
        
        .article-view pre { background: #282c34; padding: 20px; border-radius: 10px; overflow-x: auto; margin: 25px 0; position: relative; }
        .article-view code { font-family: 'Fira Code', monospace; font-size: 14px; }
        .article-view p code { background: var(--bg3); padding: 3px 6px; border-radius: 4px; font-size: 14px; color: #e83e8c; }
        
        .copy-btn { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; padding: 5px 10px; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .copy-btn:hover { background: rgba(255,255,255,0.2); }

        .btn-back { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 25px; padding: 12px 20px; background: #0288d1; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; transition: all 0.2s; }
        .btn-back:hover { background: #0277bd; transform: translateY(-2px); }

        /* --- СТРЕЛКИ --- */
        .btn-nav-fixed { position: fixed; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; border-radius: 50%; background: var(--card-bg); color: var(--text); border: 1px solid var(--border); font-size: 24px; cursor: pointer; display: none; z-index: 900; box-shadow: 0 4px 15px rgba(0,0,0,0.15); transition: all 0.2s; align-items: center; justify-content: center; }
        .btn-nav-fixed:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: translateY(-50%) scale(1.1); }
        .btn-nav-prev { left: 20px; }
        .btn-nav-next { right: 20px; }
        
        @media (max-width: 900px) {
            .btn-nav-fixed { top: auto; bottom: 80px; transform: none; width: 45px; height: 45px; font-size: 20px; background: #0288d1; color: white; border: none; }
            .btn-nav-fixed:hover { transform: scale(1.1); }
            .btn-nav-prev { left: 20px; }
            .btn-nav-next { right: 20px; }
            .article-content-wrapper { padding: 20px; }
            .topic-name { font-size: 16px; }
        }

        #btn-up { position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; border-radius: 50%; background: #0288d1; color: white; border: none; font-size: 24px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(2, 136, 209, 0.4); display: none; z-index: 1000; transition: all 0.3s; }
        #btn-up:hover { transform: scale(1.1) translateY(-3px); }

        #giscus-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 30px; }
        [data-theme="dark"] #giscus-container { background: #1e1e1e; border-color: #333; }
    </style>
</head>
<body style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    
    <button id="theme-toggle" onclick="toggleTheme()">🌙</button>
    <div id="progress-container"><div id="progress-bar"></div></div>

    <button id="btn-prev-fixed" class="btn-nav-fixed btn-nav-prev" onclick="navPrev()">←</button>
    <button id="btn-next-fixed" class="btn-nav-fixed btn-nav-next" onclick="navNext()">→</button>

    <div class="feed-container">
        <div id="list-view">
            <h1 class="feed-header">Оглавление</h1>
            <div class="search-wrapper">
                <input type="text" id="search-input" class="search-bar" placeholder="🔍 Поиск по всем темам...">
            </div>
            <div id="posts-feed">
                <p style="color: var(--fg3); text-align: center; padding: 40px 0;">Загрузка...</p>
            </div>
        </div>

        <div id="article-view" class="article-view">
            <button class="btn-back" onclick="backToFeed()">← Назад к оглавлению</button>
            <div class="article-content-wrapper">
                <div id="article-content"></div>
            </div>
            <div id="feedback-container" style="margin-top: 30px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 30px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.02);">
                <h3 style="margin-top:0; font-family: monospace; font-size: 20px;">Оставить отзыв</h3>
                <p style="color: var(--fg2); font-size: 15px; margin-bottom: 20px;">Есть вопросы, замечания или предложения по этой статье? Напишите мне напрямую!</p>
                <a id="email-feedback-btn" href="#" style="display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; background: #0288d1; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 16px; transition: all 0.2s; box-shadow: 0 4px 10px rgba(2, 136, 209, 0.3);">
                    ✉️ Написать письмо
                </a>
            </div>
        </div>
    </div>

    <button id="btn-up" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑</button>

    <script>
        let allPosts = [];
        let currentPostsList = []; 
        let currentPostIndex = -1;
        let searchIndex = null;
        let currentQuery = '';
        let openTopics = new Set(); // Запоминаем, какие папки открыты

        // --- ТЕМА ---
        var currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        document.getElementById('theme-toggle').textContent = currentTheme === 'dark' ? '☀️' : '🌙';
        function toggleTheme() {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            var newTheme = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            document.getElementById('theme-toggle').textContent = newTheme === 'dark' ? '☀️' : '🌙';
        }

        // --- ЗАГРУЗКА И ГРУППИРОВКА ---
        fetch('./posts.json')
            .then(r => r.json())
            .then(posts => {
                allPosts = posts;
                searchIndex = new FlexSearch.Document({ document: { id: "id", index: ["title", "preview"], store: true }, tokenize: "forward" });
                posts.forEach(p => searchIndex.add(p));
                renderFeed(posts);
            })
            .catch(e => { document.getElementById('posts-feed').innerHTML = '<p style="color:red; text-align:center;">Ошибка загрузки.</p>'; });

        document.getElementById('search-input').addEventListener('input', (e) => {
            currentQuery = e.target.value.trim();
            if (!currentQuery) { renderFeed(allPosts); return; }
            if (!searchIndex) return;
            const results = searchIndex.search(currentQuery, { limit: 50 });
            const ids = new Set();
            results.forEach(res => res.result.forEach(id => ids.add(id)));
            renderFeed(allPosts.filter(p => ids.has(p.id)), currentQuery);
        });

        function renderFeed(posts, query = '') {
            currentPostsList = posts; 
            const feed = document.getElementById('posts-feed');
            feed.innerHTML = '';
            if (posts.length === 0) { feed.innerHTML = '<p style="text-align:center; color:var(--fg3);">Ничего не найдено.</p>'; return; }

            // Группируем
            const groups = {};
            posts.forEach(p => {
                const tid = p.thread_id || 'general';
                if (!groups[tid]) {
                    let groupName = (p.title || '').split('(')[0].replace(/Re:|Aw:|Fwd:/gi, '').trim() || 'Общее';
                    groups[tid] = { tid: tid, name: groupName, posts: [], date: p.date };
                }
                groups[tid].posts.push(p);
                // Обновляем дату группы на самую свежую
                if (p.date > groups[tid].date) groups[tid].date = p.date;
            });

            // Сортируем группы (сначала свежие)
            const sortedGroups = Object.values(groups).sort((a, b) => b.date.localeCompare(a.date));

            sortedGroups.forEach(group => {
                // Если идет поиск - раскрываем группу принудительно
                const isOpen = query ? true : openTopics.has(group.tid);
                const icon = isOpen ? '📂' : '📁';
                
                const groupEl = document.createElement('div');
                groupEl.className = 'topic-group';
                
                // Заголовок папки
                const header = document.createElement('div');
                header.className = 'topic-header';
                header.innerHTML = `
                    <span class="topic-icon">${icon}</span>
                    <span class="topic-name">${highlight(group.name, query)}</span>
                    <span class="topic-count">${group.posts.length} писем</span>
                `;
                
                // Клик по папке (раскрыть/скрыть)
                header.onclick = () => {
                    if (query) return; // При поиске не даем закрывать
                    if (openTopics.has(group.tid)) openTopics.delete(group.tid);
                    else openTopics.add(group.tid);
                    renderFeed(posts, query);
                };

                // Контейнер для карточек
                const postsContainer = document.createElement('div');
                postsContainer.className = 'topic-posts ' + (isOpen ? 'open' : '');

                group.posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    const isBookmarked = localStorage.getItem('bm_' + post.id) === '1';
                    
                    card.innerHTML = `
                        <div class="bookmark-btn ${isBookmarked ? 'active' : ''}" onclick="toggleBookmark(event, '${post.id}')">★</div>
                        <h3 class="post-title">${highlight(post.title, query)}</h3>
                        <p class="post-preview">${highlight(post.preview || '', query)}</p>
                        <div class="post-meta">
                            <span>${post.date}</span>
                            <span>Читать →</span>
                        </div>
                    `;
                    card.onclick = (e) => { if (!e.target.classList.contains('bookmark-btn')) loadPost(post.filename); };
                    postsContainer.appendChild(card);
                });

                groupEl.appendChild(header);
                groupEl.appendChild(postsContainer);
                feed.appendChild(groupEl);
            });
        }

        function highlight(text, query) {
            if (!query) return text;
            return text.replace(new RegExp(`(${query})`, 'gi'), '<mark>$1</mark>');
        }

        function toggleBookmark(e, id) {
            e.stopPropagation();
            const key = 'bm_' + id;
            if (localStorage.getItem(key) === '1') { localStorage.removeItem(key); e.target.classList.remove('active'); }
            else { localStorage.setItem(key, '1'); e.target.classList.add('active'); }
        }

        // --- СТАТЬЯ ---
        function backToFeed() {
            document.getElementById('article-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            document.getElementById('progress-container').style.display = 'none';
            document.getElementById('btn-prev-fixed').style.display = 'none';
            document.getElementById('btn-next-fixed').style.display = 'none';
            
            window.scrollTo(0,0);
        }

        function loadPost(filename) {
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('article-view').style.display = 'block';
            document.getElementById('progress-container').style.display = 'block';
            document.getElementById('article-content').innerHTML = '<p style="text-align:center; padding: 40px;">Загрузка...</p>';
            window.scrollTo(0,0);

            currentPostIndex = currentPostsList.findIndex(p => p.filename === filename);
            updateNavButtons();

            fetch('./posts/' + filename)
                .then(r => r.text())
                .then(md => {
                    document.getElementById('article-content').innerHTML = marked.parse(md);
                    
                    document.querySelectorAll('pre code').forEach((block) => {
                        hljs.highlightElement(block);
                        const pre = block.parentNode;
                        const btn = document.createElement('button');
                        btn.className = 'copy-btn';
                        btn.innerText = 'Copy';
                        btn.onclick = (e) => {
                            e.stopPropagation();
                            navigator.clipboard.writeText(block.innerText).then(() => {
                                btn.innerText = 'Copied!';
                                setTimeout(() => btn.innerText = 'Copy', 2000);
                            });
                        };
                        pre.appendChild(btn);
                    });

                    if (currentQuery) highlightArticleText(currentQuery);
                    // Устанавливаем ссылку для отправки письма
                    const postTitle = currentPostsList[currentPostIndex].title;
                    const emailAddr = 'valeriy.onuchin@yandex.ru'; // Твой email
                    const subject = encodeURIComponent(`Отзыв на статью: ${postTitle}`);
                    const body = encodeURIComponent(`Привет, Валерий!\n\nПишу по поводу статьи "${postTitle}".\n\n[Твой текст здесь]\n`);
                    document.getElementById('email-feedback-btn').href = `mailto:${emailAddr}?subject=${subject}&body=${body}`;
                })
                .catch(e => { document.getElementById('article-content').innerHTML = '<p style="color:red;">Ошибка.</p>'; });
        }

        function highlightArticleText(query) {
            const content = document.getElementById('article-content');
            const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, null, false);
            let node;
            const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${safeQuery})`, 'gi');
            const nodesToReplace = [];
            
            while (node = walker.nextNode()) {
                if (node.parentNode.nodeName !== 'SCRIPT' && node.parentNode.nodeName !== 'STYLE' && node.parentNode.nodeName !== 'MARK' && node.parentNode.nodeName !== 'PRE' && node.parentNode.nodeName !== 'CODE') {
                    if (regex.test(node.nodeValue)) nodesToReplace.push(node);
                }
            }
            nodesToReplace.forEach(n => {
                const span = document.createElement('span');
                const escapedText = n.nodeValue.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                span.innerHTML = escapedText.replace(regex, '<mark>$1</mark>');
                n.parentNode.replaceChild(span, n);
            });
        }

        function updateNavButtons() {
            const btnPrev = document.getElementById('btn-prev-fixed');
            const btnNext = document.getElementById('btn-next-fixed');
            if (currentPostIndex > 0) btnPrev.style.display = 'flex'; else btnPrev.style.display = 'none';
            if (currentPostIndex !== -1 && currentPostIndex < currentPostsList.length - 1) btnNext.style.display = 'flex'; else btnNext.style.display = 'none';
        }

        function navPrev() { if (currentPostIndex > 0) loadPost(currentPostsList[currentPostIndex - 1].filename); }
        function navNext() { if (currentPostIndex !== -1 && currentPostIndex < currentPostsList.length - 1) loadPost(currentPostsList[currentPostIndex + 1].filename); }

        // --- СКРОЛЛ ---
        window.onscroll = function() {
            const btnUp = document.getElementById('btn-up');
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) btnUp.style.display = "block";
            else btnUp.style.display = "none";

            if (document.getElementById('article-view').style.display === 'block') {
                const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scrolled = (winScroll / height) * 100;
                document.getElementById("progress-bar").style.width = scrolled + "%";
            }
        };

                    }, 4000);

            script.onload = () => {
                setTimeout(() => { if (container.querySelector('iframe')) clearTimeout(timeout); }, 500);
            };
            container.appendChild(script);
        }
    </script>
</body>
</html>
