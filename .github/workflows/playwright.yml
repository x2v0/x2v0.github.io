name: Playwright Tests
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 18
    - name: Install dependencies
      run: npm init -y && npm install -D @playwright/test && npx playwright install --with-deps chromium
    - name: Start local server
      run: python3 -m http.server 8080 &
    - name: Run Playwright tests
      run: npx playwright test tests/portfolio.spec.js
