<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio — Валерий Онучин</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .project-card { padding: 20px; border: 1px solid var(--border-color, #ddd); border-radius: 8px; background: var(--card-bg, #fff); transition: transform 0.2s; display: flex; flex-direction: column; }
        .project-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .project-card h3 { margin-top: 0; color: #0288d1; }
        .tech-stack { font-size: 12px; color: #666; margin-bottom: 15px; }
        .tech-stack span { background: #e3f2fd; color: #0288d1; padding: 2px 6px; border-radius: 4px; margin-right: 5px; display: inline-block; margin-bottom: 5px; }
        .btn { display: inline-block; padding: 8px 16px; background: #0288d1; color: #fff; text-decoration: none; border-radius: 4px; font-size: 14px; margin-top: auto; text-align: center; }
        .btn:hover { background: #0277bd; color: #fff; }
    </style>
</head>
<body style="font-family: monospace; padding: 20px; max-width: 1000px; margin: auto;">
    <a href="../" style="color: #0288d1; text-decoration: none;">← На главную</a>
    <h1 style="color: #0288d1; margin-top: 20px;">Portfolio</h1>
    <p>Мои открытые проекты (подгружаются из GitHub API, отсортированы по звездам).</p>
    <div id="loading" style="color: #666; margin-top: 20px;">Загрузка репозиториев...</div>
    <div class="projects-grid" id="repos-grid"></div>

    <script>
        fetch('https://api.github.com/users/x2v0/repos?per_page=100')
            .then(r => r.json())
            .then(repos => {
                document.getElementById('loading').style.display = 'none';
                const grid = document.getElementById('repos-grid');
                
                // Фильтруем форки и сортируем по звездам
                const myRepos = repos.filter(r => !r.fork).sort((a, b) => b.stargazers_count - a.stargazers_count);
                
                myRepos.forEach(repo => {
                    const card = document.createElement('div');
                    card.className = 'project-card';
                    card.innerHTML = `
                        <h3>${repo.name}</h3>
                        <div class="tech-stack">
                            ${repo.language ? `<span>${repo.language}</span>` : ''}
                            <span>⭐ ${repo.stargazers_count}</span>
                        </div>
                        <p>${repo.description || 'Без описания'}</p>
                        <a href="${repo.html_url}" class="btn" target="_blank">Открыть на GitHub</a>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(e => {
                document.getElementById('loading').innerText = 'Ошибка загрузки репозиториев.';
            });
    </script>
</body>
</html>
